<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NEXORA | Proyecto Final Tecnología</title>

    <style>

        /* ==============================
           CONFIGURACIÓN GENERAL
        ============================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{

            font-family:
            Arial,
            Helvetica,
            sans-serif;

            background:
            radial-gradient(circle at 20% 10%, #163c72 0%, transparent 30%),
            radial-gradient(circle at 80% 20%, #382061 0%, transparent 30%),
            linear-gradient(
                135deg,
                #030914,
                #07182c,
                #040914
            );

            color:white;

            min-height:100vh;

            overflow-x:hidden;

        }


        /* ==============================
           MENÚ
        ============================== */

        nav{

            position:fixed;

            top:0;

            width:100%;

            height:75px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:

            0 7%;

            background:
            rgba(3,9,20,0.78);

            backdrop-filter:
            blur(15px);

            border-bottom:
            1px solid
            rgba(255,255,255,0.08);

            z-index:1000;

        }


        .logo{

            font-size:
            1.4rem;

            font-weight:bold;

            letter-spacing:
            3px;

            color:#58e4ff;

        }


        .nav-links{

            display:flex;

            gap:28px;

        }


        .nav-links a{

            color:white;

            text-decoration:none;

            font-size:
            0.9rem;

            transition:
            0.3s;

        }


        .nav-links a:hover{

            color:#58e4ff;

        }



        /* ==============================
           PORTADA
        ============================== */

        header{

            min-height:
            100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:

            120px 7%

            70px;

        }


        .hero{

            width:100%;

            max-width:
            1250px;

            display:grid;

            grid-template-columns:
            1.2fr 0.8fr;

            gap:
            60px;

            align-items:center;

        }


        .badge{

            display:inline-block;

            padding:

            9px 14px;

            border-radius:
            50px;

            background:
            rgba(88,228,255,0.08);

            border:
            1px solid
            rgba(88,228,255,0.3);

            color:#8cecff;

            font-size:
            0.78rem;

            margin-bottom:
            25px;

        }


        h1{

            font-size:
            clamp(
                3.5rem,
                8vw,
                6.5rem
            );

            line-height:
            0.95;

            letter-spacing:
            -5px;

        }


        .gradient{

            background:
            linear-gradient(
                90deg,
                #58e4ff,
                #6fa8ff,
                #ad8cff
            );

            color:
            transparent;

            background-clip:
            text;

            -webkit-background-clip:
            text;

        }


        .hero p{

            color:#a9b8cd;

            line-height:
            1.8;

            margin:

            30px 0;

            max-width:
            650px;

            font-size:
            1.05rem;

        }


        .buttons{

            display:flex;

            gap:
            15px;

            flex-wrap:
            wrap;

        }


        .btn{

            padding:

            14px 22px;

            border-radius:
            12px;

            text-decoration:
            none;

            font-weight:
            bold;

            transition:
            0.3s;

        }


        .btn-primary{

            background:
            linear-gradient(
                135deg,
                #58e4ff,
                #6fa8ff
            );

            color:#04101d;

        }


        .btn-secondary{

            border:
            1px solid
            rgba(255,255,255,0.18);

            color:white;

            background:
            rgba(255,255,255,0.05);

        }


        .btn:hover{

            transform:
            translateY(-4px);

        }



        /* ==============================
           TARJETA ARDUINO
        ============================== */

        .arduino-card{

            position:relative;

            background:

            linear-gradient(

                145deg,

                rgba(255,255,255,0.1),

                rgba(255,255,255,0.03)

            );

            border:

            1px solid

            rgba(255,255,255,0.15);

            border-radius:
            30px;

            padding:
            30px;

            box-shadow:

            0 30px 80px

            rgba(0,0,0,0.4);

            backdrop-filter:
            blur(20px);

        }


        .status{

            display:inline-block;

            background:
            rgba(58,230,156,0.1);

            color:#5cebb0;

            padding:

            8px 12px;

            border-radius:
            30px;

            font-size:
            0.75rem;

            margin-bottom:
            25px;

        }


        .arduino{

            height:
            280px;

            border-radius:
            20px;

            display:flex;

            justify-content:center;

            align-items:center;

            background:

            linear-gradient(

                145deg,

                #07192e,

                #04101e

            );

            border:

            1px solid

            rgba(88,228,255,0.2);

        }


        .arduino-box{

            width:
            130px;

            height:
            130px;

            display:flex;

            justify-content:center;

            align-items:center;

            border-radius:
            25px;

            border:

            2px solid

            #58e4ff;

            color:#58e4ff;

            font-size:
            1.3rem;

            font-weight:bold;

            box-shadow:

            0 0 50px

            rgba(88,228,255,0.15);

        }



        /* ==============================
           SECCIONES
        ============================== */

        section{

            padding:

            90px 7%;

        }


        .container{

            max-width:
            1200px;

            margin:auto;

        }


        .section-small{

            color:#58e4ff;

            text-transform:
            uppercase;

            letter-spacing:
            3px;

            font-size:
            0.8rem;

            font-weight:bold;

            margin-bottom:
            12px;

        }


        .section-title{

            font-size:

            clamp(

                2rem,

                5vw,

                3.5rem

            );

            margin-bottom:
            20px;

        }


        .section-description{

            color:#a9b8cd;

            line-height:
            1.8;

            max-width:
            750px;

            margin-bottom:
            40px;

        }



        /* ==============================
           TARJETAS
        ============================== */

        .cards{

            display:grid;

            grid-template-columns:
            repeat(2,1fr);

            gap:
            25px;

        }


        .card{

            background:

            linear-gradient(

                145deg,

                rgba(255,255,255,0.08),

                rgba(255,255,255,0.03)

            );

            border:

            1px solid

            rgba(255,255,255,0.12);

            border-radius:
            24px;

            padding:
            30px;

            transition:
            0.3s;

        }


        .card:hover{

            transform:
            translateY(-7px);

            border-color:

            rgba(88,228,255,0.3);

        }


        .card-number{

            width:
            45px;

            height:
            45px;

            display:flex;

            align-items:center;

            justify-content:center;

            border-radius:
            14px;

            background:
            rgba(88,228,255,0.1);

            color:#58e4ff;

            font-weight:
            bold;

            margin-bottom:
            20px;

        }


        .card h3{

            margin-bottom:
            12px;

        }


        .card p{

            color:#a9b8cd;

            line-height:
            1.7;

        }



        /* ==============================
           FUNCIONAMIENTO
        ============================== */

        .process{

            display:grid;

            grid-template-columns:
            repeat(4,1fr);

            gap:
            15px;

        }


        .step{

            background:
            rgba(255,255,255,0.04);

            border:

            1px solid

            rgba(255,255,255,0.1);

            border-radius:
            20px;

            padding:
            25px;

        }


        .step span{

            color:#58e4ff;

            font-size:
            0.75rem;

            font-weight:bold;

        }


        .step h3{

            margin:

            20px 0

            10px;

        }


        .step p{

            color:#a9b8cd;

            line-height:
            1.6;

            font-size:
            0.9rem;

        }



        /* ==============================
           ODS
        ============================== */

        .ods{

            display:grid;

            grid-template-columns:
            300px 1fr;

            align-items:center;

            gap:
            45px;

            background:
            rgba(255,255,255,0.04);

            border:

            1px solid

            rgba(255,255,255,0.1);

            padding:
            40px;

            border-radius:
            30px;

        }


        .ods-circle{

            width:
            220px;

            height:
            220px;

            border-radius:
            50%;

            display:flex;

            justify-content:center;

            align-items:center;

            margin:auto;

            background:

            linear-gradient(

                135deg,

                #ffbd44,

                #ff6947,

                #d9478d,

                #3e95dc

            );

            padding:
            20px;

        }


        .ods-inner{

            width:100%;

            height:100%;

            border-radius:
            50%;

            display:flex;

            align-items:center;

            justify-content:center;

            background:#06101e;

            font-size:
            2rem;

            font-weight:bold;

        }


        .ods p{

            color:#a9b8cd;

            line-height:
            1.8;

            margin-top:
            15px;

        }



        /* ==============================
           GALERÍA
        ============================== */

        .gallery{

            display:grid;

            grid-template-columns:

            2fr 1fr 1fr;

            gap:
            15px;

        }


        .gallery-item{

            min-height:
            250px;

            position:relative;

            overflow:hidden;

            border-radius:
            22px;

            background:

            linear-gradient(

                135deg,

                #0d213b,

                #081426

            );

            border:

            1px solid

            rgba(255,255,255,0.1);

        }


        .gallery-item:first-child{

            grid-row:
            span 2;

        }


        .gallery-item img{

            width:100%;

            height:100%;

            object-fit:cover;

            transition:
            0.4s;

        }


        .gallery-item img:hover{

            transform:
            scale(1.05);

        }


        .placeholder{

            width:100%;

            height:100%;

            min-height:
            250px;

            display:flex;

            justify-content:center;

            align-items:center;

            text-align:center;

            padding:
            30px;

            color:#8296af;

        }


        .placeholder strong{

            color:white;

            display:block;

            margin-bottom:
            8px;

        }



        /* ==============================
           PDF - VIDEO - AUDIO
        ============================== */

        .media-grid{

            display:grid;

            grid-template-columns:
            1fr 1fr;

            gap:
            25px;

        }


        .media{

            overflow:hidden;

            border-radius:
            25px;

            border:

            1px solid

            rgba(255,255,255,0.12);

            background:
            rgba(255,255,255,0.04);

        }


        .media-header{

            padding:
            20px;

            border-bottom:

            1px solid

            rgba(255,255,255,0.1);

        }


        .media-header span{

            color:#a9b8cd;

            font-size:
            0.85rem;

        }


        iframe{

            width:100%;

            height:
            600px;

            border:none;

        }


        video{

            width:100%;

            display:block;

        }


        .podcast{

            margin-top:
            25px;

            padding:
            30px;

            border-radius:
            25px;

            border:

            1px solid

            rgba(255,255,255,0.12);

            background:
            rgba(255,255,255,0.04);

        }


        audio{

            width:100%;

            margin-top:
            20px;

        }



        /* ==============================
           RECURSOS
        ============================== */

        .resource{

            display:flex;

            justify-content:
            space-between;

            align-items:center;

            background:
            rgba(255,255,255,0.04);

            border:

            1px solid

            rgba(255,255,255,0.1);

            padding:
            20px;

            border-radius:
            18px;

            margin-bottom:
            12px;

            text-decoration:none;

            color:white;

            transition:
            0.3s;

        }


        .resource:hover{

            transform:
            translateX(8px);

            background:
            rgba(88,228,255,0.06);

        }


        .resource span{

            color:#58e4ff;

        }



        /* ==============================
           EQUIPO
        ============================== */

        .team{

            display:grid;

            grid-template-columns:
            repeat(3,1fr);

            gap:
            20px;

        }


        .member{

            text-align:center;

        }


        .avatar{

            width:
            100px;

            height:
            100px;

            border-radius:
            50%;

            margin:

            0 auto

            20px;

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:
            1.8rem;

            font-weight:bold;

            color:#58e4ff;

            background:

            linear-gradient(

                135deg,

                rgba(88,228,255,0.15),

                rgba(173,140,255,0.15)

            );

            border:

            1px solid

            rgba(255,255,255,0.15);

        }



        /* ==============================
           FOOTER
        ============================== */

        footer{

            margin-top:
            70px;

            border-top:

            1px solid

            rgba(255,255,255,0.1);

            padding:

            30px 7%;

            color:#8296af;

            text-align:center;

        }



        /* ==============================
           RESPONSIVE
        ============================== */

        @media(max-width:900px){

            .hero{

                grid-template-columns:
                1fr;

            }

            .process{

                grid-template-columns:
                repeat(2,1fr);

            }

            .ods{

                grid-template-columns:
                1fr;

            }

            .media-grid{

                grid-template-columns:
                1fr;

            }

            .gallery{

                grid-template-columns:
                1fr 1fr;

            }

            .team{

                grid-template-columns:
                1fr;

            }

        }


        @media(max-width:700px){

            nav{

                padding:

                0 5%;

            }

            .nav-links{

                display:none;

            }

            h1{

                letter-spacing:
                -3px;

            }

            .cards{

                grid-template-columns:
                1fr;

            }

            .process{

                grid-template-columns:
                1fr;

            }

            .gallery{

                grid-template-columns:
                1fr;

            }

            .gallery-item:first-child{

                grid-row:auto;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     MENÚ
========================================= -->

<nav>

    <div class="logo">

        NEXORA

    </div>


    <div class="nav-links">

        <a href="#proyecto">
            Proyecto
        </a>

        <a href="#funcionamiento">
            Funcionamiento
        </a>

        <a href="#ods">
            ODS
        </a>

        <a href="#evidencias">
            Evidencias
        </a>

        <a href="#documentacion">
            Documentación
        </a>

        <a href="#equipo">
            Equipo
        </a>

    </div>

</nav>



<!-- =========================================
     PORTADA
========================================= -->

<header>

    <div class="hero">


        <div>

            <div class="badge">

                ● PROYECTO FINAL · IRTRA PETAPA

            </div>


            <h1>

                Tecnología que

                <span class="gradient">

                    responde.

                </span>

            </h1>


            <p>

                <strong>NEXORA</strong>

                es una propuesta de automatización
                desarrollada para solucionar una problemática
                dentro de IRTRA Petapa mediante Arduino,
                sensores y programación en C++.

            </p>


            <div class="buttons">

                <a
                    href="#proyecto"
                    class="btn btn-primary">

                    Conocer proyecto ↓

                </a>


                <!-- CAMBIAR LINK POR EL REPOSITORIO REAL -->

                <a
                    href="https://github.com/"
                    target="_blank"
                    class="btn btn-secondary">

                    Ver GitHub ↗

                </a>

            </div>

        </div>



        <div class="arduino-card">


            <div class="status">

                ● SISTEMA FUNCIONAL

            </div>


            <div class="arduino">

                <div class="arduino-box">

                    UNO R3

                </div>

            </div>


        </div>


    </div>

</header>



<!-- =========================================
     PROYECTO
========================================= -->

<section id="proyecto">

    <div class="container">


        <div class="section-small">

            01 · EL PROYECTO

        </div>


        <h2 class="section-title">

            Una necesidad real.
            Una solución tecnológica.

        </h2>


        <p class="section-description">

            Nuestro proyecto busca identificar una problemática
            dentro de IRTRA Petapa y solucionarla mediante
            un sistema electrónico autónomo diseñado con Arduino.

        </p>



        <div class="cards">


            <div class="card">

                <div class="card-number">

                    !

                </div>


                <h3>

                    Problemática identificada

                </h3>


                <p>

                    Escribe aquí la problemática que identificaron
                    dentro del IRTRA Petapa.

                    Puede ser un problema operacional,
                    de seguridad, energético o relacionado
                    con la experiencia de los visitantes.

                </p>

            </div>



            <div class="card">

                <div class="card-number">

                    ✓

                </div>


                <h3>

                    Solución propuesta

                </h3>


                <p>

                    Explica aquí cómo funciona el circuito
                    que diseñaron y de qué manera permite
                    solucionar la problemática identificada.

                </p>

            </div>


        </div>


    </div>

</section>



<!-- =========================================
     FUNCIONAMIENTO
========================================= -->

<section id="funcionamiento">

    <div class="container">


        <div class="section-small">

            02 · FUNCIONAMIENTO

        </div>


        <h2 class="section-title">

            ¿Cómo funciona nuestro sistema?

        </h2>


        <p class="section-description">

            El sistema procesa información del entorno
            y responde automáticamente dependiendo
            de las condiciones programadas.

        </p>



        <div class="process">


            <div class="step">

                <span>

                    PASO 01

                </span>


                <h3>

                    Detección

                </h3>


                <p>

                    Los sensores obtienen información
                    del entorno.

                </p>

            </div>



            <div class="step">

                <span>

                    PASO 02

                </span>


                <h3>

                    Procesamiento

                </h3>


                <p>

                    Arduino recibe la señal
                    y ejecuta el código programado
                    en C++.

                </p>

            </div>



            <div class="step">

                <span>

                    PASO 03

                </span>


                <h3>

                    Respuesta

                </h3>


                <p>

                    Dependiendo de los datos recibidos,
                    se activa el componente correspondiente.

                </p>

            </div>



            <div class="step">

                <span>

                    PASO 04

                </span>


                <h3>

                    Resultado

                </h3>


                <p>

                    El sistema permite automatizar
                    y solucionar la problemática.

                </p>

            </div>


        </div>

    </div>

</section>



<!-- =========================================
     ODS
========================================= -->

<section id="ods">

    <div class="container">


        <div class="section-small">

            03 · IMPACTO

        </div>


        <h2 class="section-title">

            Objetivos de Desarrollo Sostenible

        </h2>



        <div class="ods">


            <div class="ods-circle">

                <div class="ods-inner">

                    ODS

                </div>

            </div>



            <div>

                <h2>

                    ODS seleccionado:
                    [NÚMERO Y NOMBRE]

                </h2>


                <p>

                    Explica aquí cuál es el Objetivo de
                    Desarrollo Sostenible relacionado
                    con el proyecto.

                    También debes explicar de qué manera
                    la solución contribuye a mejorar
                    la eficiencia, seguridad,
                    sostenibilidad o uso responsable
                    de recursos dentro del IRTRA Petapa.

                </p>

            </div>


        </div>

    </div>

</section>



<!-- =========================================
     EVIDENCIAS
========================================= -->

<section id="evidencias">

    <div class="container">


        <div class="section-small">

            04 · EVIDENCIAS

        </div>


        <h2 class="section-title">

            Del diseño a la simulación.

        </h2>


        <p class="section-description">

            En esta sección se presentan evidencias
            del desarrollo del proyecto,
            la simulación en Tinkercad,
            la infografía y las pruebas realizadas.

        </p>



        <div class="gallery">


            <!-- ======================================
                 IMAGEN 1

                 Cuando tengas la imagen puedes borrar
                 el div placeholder y poner:

                 <img src="recursos/imagenes/tinkercad.png">

            ======================================= -->


            <div class="gallery-item">

                <div class="placeholder">

                    <div>

                        <strong>

                            Captura del circuito

                        </strong>

                        recursos/imagenes/tinkercad.png

                    </div>

                </div>

            </div>



            <!-- IMAGEN 2 -->

            <div class="gallery-item">

                <div class="placeholder">

                    <div>

                        <strong>

                            Infografía

                        </strong>

                        recursos/imagenes/infografia.png

                    </div>

                </div>

            </div>



            <!-- IMAGEN 3 -->

            <div class="gallery-item">

                <div class="placeholder">

                    <div>

                        <strong>

                            Proceso de trabajo

                        </strong>

                        recursos/imagenes/proceso1.jpg

                    </div>

                </div>

            </div>



            <!-- IMAGEN 4 -->

            <div class="gallery-item">

                <div class="placeholder">

                    <div>

                        <strong>

                            Pruebas

                        </strong>

                        recursos/imagenes/proceso2.jpg

                    </div>

                </div>

            </div>



            <!-- IMAGEN 5 -->

            <div class="gallery-item">

                <div class="placeholder">

                    <div>

                        <strong>

                            Resultado final

                        </strong>

                        recursos/imagenes/final.jpg

                    </div>

                </div>

            </div>


        </div>

    </div>

</section>



<!-- =========================================
     DOCUMENTACIÓN
========================================= -->

<section id="documentacion">

    <div class="container">


        <div class="section-small">

            05 · DOCUMENTACIÓN

        </div>


        <h2 class="section-title">

            Investigación y multimedia.

        </h2>


        <p class="section-description">

            Consulta la investigación completa
            y la demostración audiovisual
            del proyecto.

        </p>



        <div class="media-grid">


            <!-- ====================================
                 PDF

                 Sube tu PDF a:

                 recursos/documentos/investigacion.pdf
            ===================================== -->


            <div class="media">


                <div class="media-header">

                    <h3>

                        Investigación Formal

                    </h3>


                    <span>

